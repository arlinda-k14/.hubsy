<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8f7f4" />
<title>Curio — Short-form Video</title>
<style>
  :root {
    --bg-main: #f8f7f4;
    --surface-card: #ffffff;
    --accent-indigo: #5046e5;
    --accent-indigo-hover: #4338ca;
    --pill-bg: #eef2ff;
    --pill-border: #dbeafe;
    --text-main: #111827;
    --text-muted: #4b5563;
    --border-light: #e5e7eb;
    --teal: #5eead4;
    --radius: 16px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(60% 35% at 50% -5%, rgba(80, 70, 229, 0.07), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px clamp(16px, 4vw, 28px);
    padding-top: max(14px, env(safe-area-inset-top));
    background: rgba(248, 247, 244, 0.88);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--border-light);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-main);
  }
  .brand .mark {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent-indigo);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    box-shadow: 0 4px 12px -4px rgba(80, 70, 229, 0.6);
  }

  .top-actions { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent-indigo);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 12px -4px rgba(80, 70, 229, 0.55);
  }
  .avatar.on { display: flex; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent-indigo);
    color: #fff;
    border: 1px solid var(--accent-indigo);
    box-shadow: 0 8px 20px -8px rgba(80, 70, 229, 0.6);
  }
  .btn-primary:hover { background: var(--accent-indigo-hover); border-color: var(--accent-indigo-hover); }

  .btn-ghost {
    background: var(--surface-card);
    color: var(--text-main);
    border: 1px solid var(--border-light);
  }
  .btn-ghost:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }

  .btn-block { width: 100%; padding: 12px 18px; }

  /* ---------- Feed ---------- */
  .feed {
    position: relative;
    z-index: 1;
    height: 100dvh;
    width: 100%;
    max-width: 462px;
    margin: 0 auto;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    scroll-behavior: smooth;
    background: var(--bg-main);
  }
  .feed::-webkit-scrollbar { display: none; }

  .video-card {
    position: relative;
    height: calc(100dvh - 20px);
    margin: 10px;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: var(--surface-card);
    border: 1px solid var(--border-light);
    border-radius: 22px;
    box-shadow: 0 16px 40px -28px rgba(17, 24, 39, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .video-card video {
    position: absolute;
    inset: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    border-radius: 15px;
    object-fit: cover;
    background: #0c0d12;
  }

  .embed-shell {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    overflow: hidden;
    background: #0c0d12;
  }
  .embed-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #0c0d12;
  }

  .link-fallback {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    overflow: hidden;
    background: linear-gradient(150deg, #eef2ff, #f8f7f4);
    border: 1px solid var(--border-light);
  }
  .link-fallback-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 100%;
    padding: 28px;
    text-align: center;
    text-decoration: none;
    color: var(--text-main);
  }
  .link-fallback .lf-icon { width: 34px; height: 34px; color: var(--accent-indigo); }
  .link-fallback .lf-icon svg { width: 100%; height: 100%; }
  .link-fallback .lf-title { font-size: 16px; font-weight: 700; }
  .link-fallback .lf-sub { font-size: 13px; color: var(--text-muted); }

  .social-card {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 32px 28px 128px;
    text-align: center;
    background:
      radial-gradient(80% 50% at 50% 0%, #eef2ff, transparent 70%),
      linear-gradient(160deg, #ffffff, #f8f7f4);
    border: 1px solid var(--border-light);
  }
  .social-card .social-logo { width: 42px; height: 42px; color: var(--accent-indigo); }
  .social-card .social-logo svg { width: 100%; height: 100%; }
  .social-card .social-handle { font-size: 13.5px; font-weight: 600; color: var(--accent-indigo); }
  .social-card .social-title {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-main);
    max-width: 30ch;
  }
  .social-card .social-cta { margin-top: 8px; }

  .scrim {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    background: linear-gradient(to top, rgba(17, 24, 39, 0.28) 0%, transparent 34%);
    pointer-events: none;
  }

  .card-content {
    position: absolute;
    left: 8px; right: 8px; bottom: 8px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    border: 1px solid var(--border-light);
    border-radius: 15px;
  }

  .badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-main);
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .badge::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.28);
  }

  .video-title {
    font-size: clamp(18px, 4.4vw, 22px);
    font-weight: 700;
    line-height: 1.28;
    color: var(--text-main);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
  }
  .handle { color: var(--accent-indigo); font-weight: 600; }
  .credit-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    background: var(--surface-card);
    border: 1px solid var(--border-light);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  .credit-tag::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--teal);
  }

  /* ---------- Action rail ---------- */
  .rail {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
  }
  .rail button {
    width: 46px; height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 8px 20px -12px rgba(17, 24, 39, 0.4);
    transition: transform .15s ease, border-color .2s ease, color .2s ease, background .2s ease;
  }
  .rail button:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
  .rail button:active { transform: scale(0.92); }
  .rail button svg { width: 22px; height: 22px; }
  .rail button.active {
    color: #fff;
    background: var(--accent-indigo);
    border-color: var(--accent-indigo);
    box-shadow: 0 8px 20px -8px rgba(80, 70, 229, 0.7);
  }

  .play-toggle {
    position: absolute;
    inset: 0;
    z-index: 4;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .play-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    color: var(--accent-indigo);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    box-shadow: 0 12px 30px -12px rgba(17, 24, 39, 0.5);
  }
  .video-card.paused .play-badge { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .play-badge svg { width: 28px; height: 28px; }

  /* ---------- Empty / loading ---------- */
  .state-screen {
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 32px;
  }
  .state-screen .badge { align-self: center; }
  .state-screen h2 { font-size: 22px; font-weight: 700; color: var(--text-main); }
  .state-screen p { color: var(--text-muted); font-size: 14px; line-height: 1.55; max-width: 300px; }

  .spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--border-light);
    border-top-color: var(--accent-indigo);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 1px solid var(--border-light);
    background: var(--surface-card);
    color: var(--text-main);
    border-radius: var(--radius);
    padding: 0;
    width: min(92vw, 400px);
    box-shadow: 0 30px 70px -30px rgba(17, 24, 39, 0.45);
    overflow: hidden;
  }
  dialog::backdrop {
    background: rgba(17, 24, 39, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .dialog-head {
    padding: 22px 22px 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dialog-head h3 { font-size: 19px; font-weight: 700; color: var(--text-main); }
  .dialog-head p { color: var(--text-muted); font-size: 13px; }
  .dialog-body { padding: 16px 22px 22px; display: flex; flex-direction: column; gap: 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; }
  .field input, .field select {
    font-family: inherit;
    font-size: 14px;
    color: var(--text-main);
    background: var(--surface-card);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 11px 13px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
    width: 100%;
  }
  .field input::placeholder { color: #9ca3af; }
  .field input:focus, .field select:focus {
    border-color: var(--accent-indigo);
    box-shadow: 0 0 0 3px rgba(80, 70, 229, 0.15);
  }
  .field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  .msg { font-size: 13px; min-height: 18px; }
  .msg.error { color: #dc2626; }
  .msg.ok { color: var(--accent-indigo); }

  .switch-line {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .switch-line button {
    background: none; border: none; color: var(--accent-indigo);
    font: inherit; font-weight: 600; cursor: pointer; padding: 0 2px;
  }
  .switch-line button:hover { text-decoration: underline; }

  .dialog-row { display: flex; gap: 10px; }
  .dialog-row .btn { flex: 1; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark">C</span>Curio</div>
  <div class="top-actions">
    <button class="btn btn-ghost" id="adminBtn" hidden>Add a clip</button>
    <button class="btn btn-primary" id="authBtn">Sign in</button>
    <button class="avatar" id="avatarBtn" title="Sign out"></button>
  </div>
</header>

<main class="feed" id="feed" aria-live="polite">
  <section class="state-screen">
    <div class="spinner"></div>
    <p>Loading the feed…</p>
  </section>
</main>

<!-- Auth dialog -->
<dialog id="authDialog">
  <div class="dialog-head">
    <h3 id="authTitle">Sign in to Curio</h3>
    <p id="authSub">Bookmark clips and contribute to the feed.</p>
  </div>
  <form class="dialog-body" id="authForm" method="dialog">
    <div class="field">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" autocomplete="email" required placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters" />
    </div>
    <div class="msg" id="authMsg"></div>
    <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Sign in</button>
    <p class="switch-line">
      <span id="authSwitchText">New to Curio?</span>
      <button type="button" id="authSwitch">Create an account</button>
    </p>
  </form>
</dialog>

<!-- Admin / submit dialog -->
<dialog id="adminDialog">
  <div class="dialog-head">
    <h3>Add a clip</h3>
    <p>Publish a video straight to the feed.</p>
  </div>
  <form class="dialog-body" id="adminForm">
    <div class="field">
      <label for="vUrl">Video URL</label>
      <input type="url" id="vUrl" required placeholder="YouTube, Instagram, TikTok or .mp4 link" />
    </div>
    <div class="field">
      <label for="vTitle">Title</label>
      <input type="text" id="vTitle" required maxlength="120" placeholder="A quiet morning in Kyoto" />
    </div>
    <div class="field">
      <label for="vCategory">Category</label>
      <select id="vCategory" required>
        <option>Tech</option>
        <option>VibeCoding</option>
        <option>Marketing</option>
        <option>Data</option>
      </select>
    </div>
    <div class="field">
      <label for="vHandle">Creator Handle</label>
      <input type="text" id="vHandle" required placeholder="@creator" />
    </div>
    <div class="field">
      <label for="vCredit">Creator Credit</label>
      <input type="text" id="vCredit" required placeholder="Filmed on Super 8 · 2025" />
    </div>
    <div class="msg" id="adminMsg"></div>
    <div class="dialog-row">
      <button type="button" class="btn btn-ghost" id="adminCancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="adminSubmit">Publish clip</button>
    </div>
  </form>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
